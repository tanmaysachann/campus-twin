<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CampusTwin | xeokit BIM Viewer</title>
    <link rel="stylesheet" href="./lib/fontawesome-free-5.11.2-web/css/all.min.css" type="text/css" />
    <link rel="stylesheet" href="../dist/xeokit-bim-viewer.css" type="text/css" />
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <input type="checkbox" id="explorer_toggle" />
    <label for="explorer_toggle" class="xeokit-i18n explorer_toggle_label xeokit-btn fas fa-2x fa-sitemap"
        data-xeokit-i18ntip="toolbar.toggleExplorer" data-tippy-content="Toggle explorer"></label>
    <input type="checkbox" id="inspector_toggle" />
    <label id="inspector_toggle_label" for="inspector_toggle"
        class="xeokit-i18n inspector_toggle_label xeokit-btn fas fa-info-circle fa-2x"
        data-xeokit-i18ntip="toolbar.toggleProperties" data-tippy-content="Toggle properties"></label>
    <div id="myExplorer"></div>
    <div id="myToolbar"></div>
    <div id="myInspector"></div>
    <div id="myViewer">
        <canvas id="myCanvas"></canvas>
        <canvas id="myNavCubeCanvas"></canvas>
    </div>

</body>

<!-- Tooltips libraries -->
<script src="./lib/popper.js"></script>
<script src="./lib/tippy.js"></script>

<script type="module">

    import { Server, BIMViewer, LocaleService } from "../dist/xeokit-bim-viewer.es.js";

    import { messages as localeMessages } from "../dist/messages.js";

    window.onload = function () {

        const requestParams = getRequestParams();
        const locale = requestParams.locale || "en";
        const projectId = requestParams.projectId;

        if (!projectId) {
            return;
        }

        const openExplorer = requestParams.openExplorer;
        setExplorerOpen(openExplorer === "true");

        const enableEditModels = (requestParams.enableEditModels === "true");

        const server = new Server({
            dataDir: requestParams.dataDir || "./data"
        });

        const bimViewer = new BIMViewer(server, {
            localeService: new LocaleService({
                messages: localeMessages,
                locale: locale
            }),
            enableMeasurements: true,
            canvasElement: document.getElementById("myCanvas"), // WebGL canvas
            keyboardEventsElement: document, // Optional, defaults to document
            explorerElement: document.getElementById("myExplorer"), // Left panel
            toolbarElement: document.getElementById("myToolbar"), // Toolbar
            inspectorElement: document.getElementById("myInspector"), // Right panel
            navCubeCanvasElement: document.getElementById("myNavCubeCanvas"),
            busyModelBackdropElement: document.getElementById("myViewer"),
            enableEditModels: enableEditModels
        });

        bimViewer.localeService.on("updated", () => {
            const localizedElements = document.querySelectorAll('.xeokit-i18n');
            localizedElements.forEach((localizedElement) => {
                if (localizedElement.dataset.xeokitI18n) {
                    localizedElement.innerText = bimViewer.localeService.translate(localizedElement.dataset.xeokitI18n);
                }
                if (localizedElement.dataset.xeokitI18ntip) {
                    const translation = bimViewer.localeService.translate(localizedElement.dataset.xeokitI18ntip);
                    if (translation) {
                        localizedElement.dataset.tippyContent = bimViewer.localeService.translate(localizedElement.dataset.xeokitI18ntip);
                    }
                }
                if (localizedElement.dataset.tippyContent) {
                    if (localizedElement._tippy) {
                        localizedElement._tippy.setContent(localizedElement.dataset.tippyContent);
                    } else {
                        tippy(localizedElement, {
                            appendTo: "parent",
                            zIndex: 1000000,
                            allowHTML: true
                        });
                    }
                }
            });
        });

        bimViewer.setConfigs({
            "showSpaces": false, // Default
            "selectedGlowThrough": true,
            "highlightGlowThrough": true,
            "dtxEnabled": true // Enable data texture scene representation for models - may be slow on low-spec GPUs
        });

        bimViewer.on("openExplorer", () => {
            setExplorerOpen(true);
        });

        bimViewer.on("openInspector", () => {
            setInspectorOpen(true);
        });

        bimViewer.on("addModel", (event) => { // "Add" selected in Models tab's context menu
            console.log("addModel: " + JSON.stringify(event, null, "\t"));
        });

        bimViewer.on("editModel", (event) => { // "Edit" selected in Models tab's context menu
            console.log("editModel: " + JSON.stringify(event, null, "\t"));
        });

        bimViewer.on("deleteModel", (event) => { // "Delete" selected in Models tab's context menu
            console.log("deleteModel: " + JSON.stringify(event, null, "\t"));
        });

        const viewerConfigs = requestParams.configs;
        if (viewerConfigs) {
            const configNameVals = viewerConfigs.split(",");
            for (let i = 0, len = configNameVals.length; i < len; i++) {
                const configNameValStr = configNameVals[i];
                const configNameVal = configNameValStr.split(":");
                const configName = configNameVal[0];
                const configVal = configNameVal[1];
                bimViewer.setConfig(configName, configVal);
            }
        }

        bimViewer.loadProject(projectId, () => {
            const modelId = requestParams.modelId;
            if (modelId) {
                bimViewer.loadModel(modelId);
            }
            const tab = requestParams.tab;
            if (tab) {
                bimViewer.openTab(tab);
            }
            watchHashParams();
            announceWhenReady();
        },
            (errorMsg) => {
                console.error(errorMsg);
            });

        function watchHashParams() {
            let lastHash = "";
            window.setInterval(() => {
                const currentHash = window.location.hash;
                if (currentHash !== lastHash) {
                    parseHashParams();
                    lastHash = currentHash;
                }
            }, 400);
        }

        function parseHashParams() {
            const params = getHashParams();
            const actionsStr = params.actions;
            if (!actionsStr) {
                return;
            }
            const actions = actionsStr.split(",");
            if (actions.length === 0) {
                return;
            }
            for (let i = 0, len = actions.length; i < len; i++) {
                const action = actions[i];
                switch (action) {
                    case "focusObject":
                        const objectId = params.objectId;
                        if (!objectId) {
                            console.error("Param expected for `focusObject` action: 'objectId'");
                            break;
                        }
                        bimViewer.setAllObjectsSelected(false);
                        bimViewer.setObjectsSelected([objectId], true);
                        bimViewer.flyToObject(objectId, () => {
                            // FIXME: Showing objects in tabs involves scrolling the HTML within the tabs - disable until we know how to scroll the correct DOM element. Otherwise, that function works OK

                            // bimViewer.showObjectInObjectsTab(objectId);
                            // bimViewer.showObjectInClassesTab(objectId);
                            // bimViewer.showObjectInStoreysTab(objectId);
                        });
                        break;
                    case "focusObjects":
                        const objectIds = params.objectIds;
                        if (!objectIds) {
                            console.error("Param expected for `focusObjects` action: 'objectIds'");
                            break;
                        }
                        const objectIdArray = objectIds.split(",");
                        bimViewer.setAllObjectsSelected(false);
                        bimViewer.setObjectsSelected(objectIdArray, true);
                        bimViewer.viewFitObjects(objectIdArray, () => {
                        });
                        break;
                    case "clearFocusObjects":
                        bimViewer.setAllObjectsSelected(false);
                        bimViewer.viewFitAll();
                        // TODO: view fit nothing?
                        break;
                    case "openTab":
                        const tabId = params.tabId;
                        if (!tabId) {
                            console.error("Param expected for `openTab` action: 'tabId'");
                            break;
                        }
                        bimViewer.openTab(tabId);
                        break;
                    default:
                        console.error("Action not supported: '" + action + "'");
                        break;
                }
            }
        }

        function setExplorerOpen(explorerOpen) {
            const toggle = document.getElementById("explorer_toggle");
            if (toggle) {
                toggle.checked = explorerOpen;
            }
        }

        function setInspectorOpen(inspectorOpen) {
            const toggle = document.getElementById("inspector_toggle");
            if (toggle) {
                toggle.checked = inspectorOpen;
            }
        }

        function getRequestParams() {
            const vars = {};
            window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, (m, key, value) => {
                vars[key] = value;
            });
            return vars;
        }

        function getHashParams() {
            const hashParams = {};
            let e;
            const a = /\+/g;  // Regex for replacing addition symbol with a space
            const r = /([^&;=]+)=?([^&;]*)/g;
            const d = function (s) {
                return decodeURIComponent(s.replace(a, " "));
            };
            const q = window.location.hash.substring(1);
            while (e = r.exec(q)) {
                hashParams[d(e[1])] = d(e[2]);
            }
            return hashParams;
        }

        function objectIdsByTypes(types) {
            const ids = [];
            for (const type of types) {
                ids.push(...(bimViewer.viewer.metaScene.getObjectIDsByType(type) || []));
            }
            return [...new Set(ids)];
        }

        let roofObjectIds = [];

        function collectRoofObjects() {
            const scene = bimViewer.viewer.scene;
            const nativeRoofs = objectIdsByTypes(["IfcRoof"])
                .filter(objectId => scene.objects[objectId]);
            if (nativeRoofs.length) {
                roofObjectIds = nativeRoofs;
                return;
            }
            const slabs = objectIdsByTypes(["IfcSlab"])
                .filter(objectId => scene.objects[objectId]?.aabb);
            if (!slabs.length) return;
            const top = Math.max(...slabs.map(objectId => scene.objects[objectId].aabb[4]));
            const [, ymin, , , ymax] = scene.getAABB(scene.objectIds || []);
            const tolerance = Math.max((ymax - ymin) * 0.035, 0.25);
            roofObjectIds = slabs.filter(objectId => scene.objects[objectId].aabb[4] >= top - tolerance);
        }

        function buildingBlockObjectIds(buildingIndex = 0, buildingCount = 1) {
            const scene = bimViewer.viewer.scene;
            const candidates = (scene.objectIds || [])
                .filter(objectId => scene.objects[objectId]);
            if (!candidates.length) return [];
            const [xmin, , zmin, xmax, , zmax] = scene.getAABB(candidates);
            const count = Math.max(1, Number(buildingCount) || 1);
            const columns = Math.ceil(Math.sqrt(count));
            const rows = Math.ceil(count / columns);
            const index = Math.min(count - 1, Math.max(0, Number(buildingIndex) || 0));
            const column = index % columns;
            const row = Math.floor(index / columns);
            const cellMinX = xmin + ((xmax - xmin) * column / columns);
            const cellMaxX = xmin + ((xmax - xmin) * (column + 1) / columns);
            const cellMinZ = zmin + ((zmax - zmin) * row / rows);
            const cellMaxZ = zmin + ((zmax - zmin) * (row + 1) / rows);
            const centerInCell = objectId => {
                const aabb = scene.objects[objectId]?.aabb;
                if (!aabb) return false;
                const centerX = (aabb[0] + aabb[3]) / 2;
                const centerZ = (aabb[2] + aabb[5]) / 2;
                return centerX >= cellMinX && centerX <= cellMaxX
                    && centerZ >= cellMinZ && centerZ <= cellMaxZ;
            };
            let result = candidates.filter(centerInCell);
            if (!result.length) {
                const centerX = (cellMinX + cellMaxX) / 2;
                const centerZ = (cellMinZ + cellMaxZ) / 2;
                result = candidates
                    .map(objectId => {
                        const aabb = scene.objects[objectId].aabb;
                        const dx = ((aabb[0] + aabb[3]) / 2) - centerX;
                        const dz = ((aabb[2] + aabb[5]) / 2) - centerZ;
                        return [objectId, dx * dx + dz * dz];
                    })
                    .sort((left, right) => left[1] - right[1])
                    .slice(0, Math.max(12, Math.ceil(candidates.length / count)))
                    .map(item => item[0]);
            }
            return [...new Set([...result, ...roofObjectIds.filter(centerInCell)])];
        }

        function resetCampusTwinAppearance() {
            const scene = bimViewer.viewer.scene;
            const allIds = scene.objectIds || [];
            scene.setObjectsVisible(allIds, true);
            scene.setObjectsXRayed(scene.xrayedObjectIds || [], false);
            scene.setObjectsSelected(scene.selectedObjectIds || [], false);
            scene.setObjectsColorized(allIds, null);
            scene.setObjectsOpacity(allIds, 1.0);
            scene.setObjectsVisible(roofObjectIds, true);
            scene.setObjectsXRayed(roofObjectIds, false);
            scene.setObjectsOpacity(roofObjectIds, 1.0);
            return allIds;
        }

        function renderableObjectIdsInSubtrees(rootIds = []) {
            const scene = bimViewer.viewer.scene;
            const metaScene = bimViewer.viewer.metaScene;
            const result = [];
            for (const rootId of rootIds) {
                const metaObject = metaScene.metaObjects[rootId];
                const subtreeIds = metaObject ? metaObject.getObjectIDsInSubtree() : [rootId];
                for (const objectId of subtreeIds) {
                    if (scene.objects[objectId]) result.push(objectId);
                }
            }
            return [...new Set(result)];
        }

        function applyCampusTwinState(state = {}) {
            const scene = bimViewer.viewer.scene;
            const allIds = resetCampusTwinAppearance();
            if (!allIds.length) return;

            const selection = state.selection;
            const scenarioHighlights = state.scenarioHighlights || [];
            if (scenarioHighlights.length) {
                const allFocusIds = [];
                // Keep the complete BIM model visible while scenario spaces stand out.
                // Moderate transparency exposes internal rooms without reducing the
                // surrounding building to a faint wireframe.
                scene.setObjectsOpacity(allIds, 0.58);
                for (const impact of scenarioHighlights) {
                    const directIds = (impact.objectIds || []).filter(objectId => scene.objects[objectId]);
                    const impactIds = [...new Set([
                        ...renderableObjectIdsInSubtrees(impact.rootObjectIds || []),
                        ...directIds
                    ])];
                    if (!impactIds.length) continue;
                    allFocusIds.push(...impactIds);
                    scene.setObjectsXRayed(impactIds, false);
                    scene.setObjectsOpacity(impactIds, 1.0);
                    const color = impact.role === "source"
                        ? [0.94, 0.29, 0.21]
                        : impact.role === "destination"
                            ? [0.14, 0.66, 0.34]
                            : [0.89, 0.55, 0.08];
                    scene.setObjectsColorized(impactIds, color);
                }
                if (state.focus !== false && allFocusIds.length) {
                    bimViewer.viewFitObjects([...new Set(allFocusIds)]);
                }
                return;
            }
            if (selection?.kind === "building") {
                const blockIds = buildingBlockObjectIds(selection.buildingIndex, selection.buildingCount);
                if (blockIds.length) {
                    scene.setObjectsXRayed(allIds, true);
                    scene.setObjectsOpacity(allIds, 0.28);
                    scene.setObjectsXRayed(blockIds, false);
                    scene.setObjectsOpacity(blockIds, 1.0);
                    scene.setObjectsColorized(blockIds, [0.72, 1.0, 0.13]);
                    if (state.focus !== false) bimViewer.viewFitObjects(blockIds);
                }
                return;
            }
            if (selection?.rootObjectIds?.length || selection?.objectIds?.length) {
                const rootIds = selection.rootObjectIds || [];
                const directIds = (selection.objectIds || []).filter(objectId => scene.objects[objectId]);
                const focusIds = [...new Set([...renderableObjectIdsInSubtrees(rootIds), ...directIds])];
                if (focusIds.length) {
                    scene.setObjectsXRayed(allIds, true);
                    scene.setObjectsXRayed(focusIds, false);
                    if (selection.kind === "room") {
                        scene.setObjectsColorized(focusIds, [0.94, 0.29, 0.21]);
                    }
                    if (state.focus !== false) bimViewer.viewFitObjects(rootIds.length ? rootIds : focusIds);
                }
                return;
            }

            const stage = Number(state.stage || 0);
            const layer = state.layer || "scenario";
            const walls = objectIdsByTypes(["IfcWall", "IfcWallStandardCase", "IfcCurtainWall"]);
            const spaces = objectIdsByTypes(["IfcSpace", "IfcSlab", "IfcRoof"]);
            const openings = objectIdsByTypes(["IfcDoor", "IfcWindow", "IfcOpeningElement"]);
            const services = objectIdsByTypes([
                "IfcFlowSegment", "IfcFlowTerminal", "IfcFlowController", "IfcDistributionElement",
                "IfcDuctSegment", "IfcPipeSegment", "IfcCableCarrierSegment"
            ]);
            const storeys = objectIdsByTypes(["IfcBuildingStorey"]);
            let focusIds = [];

            if (layer === "schedule") {
                focusIds = openings.length ? openings : allIds.slice(0, Math.max(8, Math.ceil(allIds.length * 0.05)));
                scene.setObjectsColorized(focusIds, [0.94, 0.29, 0.21]);
            } else if (layer === "capacity") {
                focusIds = spaces.length ? spaces : walls.slice(0, Math.max(12, Math.ceil(walls.length * 0.18)));
                scene.setObjectsColorized(focusIds, [0.12, 0.63, 0.34]);
            } else if (layer === "energy") {
                focusIds = services.length ? services : openings;
                scene.setObjectsXRayed(allIds, true);
                scene.setObjectsXRayed(focusIds, false);
                scene.setObjectsColorized(focusIds, [0.23, 0.67, 0.91]);
            } else if (stage === 1) {
                focusIds = spaces.length ? spaces : walls.slice(0, Math.max(10, Math.ceil(walls.length * 0.12)));
                scene.setObjectsColorized(focusIds, [0.89, 0.55, 0.08]);
            } else if (stage === 2) {
                focusIds = walls.slice(0, Math.max(14, Math.ceil(walls.length * 0.2)));
                if (!focusIds.length) focusIds = allIds.slice(0, Math.max(14, Math.ceil(allIds.length * 0.08)));
                scene.setObjectsColorized(focusIds, [0.82, 0.12, 0.09]);
            } else if (stage === 3) {
                focusIds = [...openings, ...spaces].slice(0, Math.max(24, Math.ceil((openings.length + spaces.length) * 0.45)));
                scene.setObjectsXRayed(walls, true);
                scene.setObjectsColorized(focusIds, [0.14, 0.66, 0.34]);
            } else if (stage >= 4) {
                focusIds = services.length ? services : openings;
                scene.setObjectsXRayed(walls, true);
                scene.setObjectsColorized(focusIds, [0.72, 1.0, 0.13]);
            }

            if (storeys.length && (state.buildingIndex !== undefined || state.floor !== undefined)) {
                const storeyIndex = (Number(state.buildingIndex || 0) + Number(state.floor || 0)) % storeys.length;
                if (state.focus !== false) bimViewer.viewFitObjects([storeys[storeyIndex]]);
            } else if (focusIds.length && state.focus === true) {
                bimViewer.viewFitObjects(focusIds.slice(0, 80));
            }
        }

        function announceWhenReady() {
            let attempts = 0;
            const timer = window.setInterval(() => {
                attempts += 1;
                const scene = bimViewer.viewer.scene;
                const modelCount = Object.keys(scene.models || {}).length;
                if ((scene.objectIds || []).length > 0 && modelCount >= 3) {
                    window.clearInterval(timer);
                    collectRoofObjects();
                    window.parent.postMessage({
                        type: "campus-twin-xeokit-ready",
                        objectCount: scene.objectIds.length,
                        storeyCount: objectIdsByTypes(["IfcBuildingStorey"]).length,
                        modelCount
                    }, window.location.origin);
                } else if (attempts > 120) {
                    window.clearInterval(timer);
                    window.parent.postMessage({type: "campus-twin-xeokit-error", message: "BIM model timed out while loading."}, window.location.origin);
                }
            }, 250);
        }

        bimViewer.viewer.scene.on("objectSelected", (entity) => {
            if (!entity?.selected) return;
            window.parent.postMessage({
                type: "campus-twin-xeokit-selection",
                objectId: entity.id
            }, window.location.origin);
        });

        window.addEventListener("message", (event) => {
            if (event.origin !== window.location.origin || event.source !== window.parent) return;
            if (event.data?.type === "campus-twin-xeokit-state") applyCampusTwinState(event.data.state);
            if (event.data?.type === "campus-twin-xeokit-fit") bimViewer.viewFitAll();
            if (event.data?.type === "campus-twin-xeokit-tab" && event.data.tab) bimViewer.openTab(event.data.tab);
        });

        window.bimViewer = bimViewer;
    }

</script>

</html>
